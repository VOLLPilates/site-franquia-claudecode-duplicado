  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #2f170f;
      --white: #fff6e3;
      --cream-deep: #efe0c6;
      --green-cta: #315d49;
      --green-on-dark: #a2d4bf;
      --gold-light: #dcbaa2;
      --dark-muted: #f0e1d2;
      --dark-soft: #ddcabb;
      --dark-rule: rgba(255,246,227,0.16);
      --serif: 'Arimo', Helvetica, Arial, sans-serif;
      --sans: 'Montserrat', Helvetica, Arial, sans-serif;
    }
    html { min-height: 100%; }
    body {
      min-height: 100%;
      font-family: var(--sans);
      background: var(--green-cta);
      color: var(--white);
      overflow: hidden;
    }
    .thank-you {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(32px, 6vw, 72px);
      isolation: isolate;
    }
    .thank-you::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(135deg, rgba(47,23,15,0.50) 0%, rgba(47,23,15,0.16) 48%, rgba(47,23,15,0.42) 100%),
        var(--green-cta);
    }
    .thank-you::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: -1;
      width: min(760px, 82vw);
      height: min(760px, 82vw);
      border: 1px solid rgba(255,246,227,0.10);
      transform: translate(-50%, -50%) rotate(8deg);
      pointer-events: none;
    }
    .message {
      width: min(100%, 820px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .logo {
      width: clamp(150px, 16vw, 220px);
      height: auto;
      display: block;
      margin-bottom: clamp(36px, 6vh, 60px);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 10px 18px;
      border: 1px solid var(--dark-rule);
      color: var(--green-on-dark);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .status svg {
      width: 16px;
      height: 16px;
      flex: none;
    }
    h1 {
      font-family: var(--serif);
      font-size: clamp(38px, 5vw, 68px);
      font-weight: 700;
      line-height: 1.06;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }
    h1 em {
      color: var(--gold-light);
      font-style: normal;
    }
    .copy {
      max-width: 680px;
      margin-top: 22px;
      color: var(--dark-muted);
      font-size: clamp(17px, 1.7vw, 22px);
      line-height: 1.55;
      text-wrap: pretty;
    }
    .copy strong {
      color: var(--white);
      font-weight: 600;
    }
    .rule {
      width: min(180px, 40vw);
      height: 1px;
      background: var(--dark-rule);
      margin: clamp(28px, 5vh, 44px) 0 0;
    }
    .note {
      margin-top: 18px;
      color: var(--dark-soft);
      font-size: 13px;
      line-height: 1.5;
    }
    /* ── BOTÃO FLUTUANTE WHATSAPP ── */
    .wa-float { position: fixed; right: 20px; bottom: 20px; z-index: 300; width: 58px; height: 58px; border-radius: 50%; background: #25d366; color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(0,0,0,0.28); transition: transform 0.2s, background 0.2s; }
    .wa-float:hover { background: #1ebe5b; transform: translateY(-2px); }
    .wa-float svg { width: 32px; height: 32px; }
    @media (max-width: 640px) {
      body { overflow: auto; }
      .thank-you { padding: 28px 20px; }
      .thank-you::after { width: 84vw; height: 84vw; }
      .logo { width: 310px; max-width: 82vw; margin-bottom: 36px; }
      .status { font-size: 11px; letter-spacing: 0.10em; }
      h1 { font-size: clamp(34px, 11vw, 46px); }
      .copy { font-size: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
