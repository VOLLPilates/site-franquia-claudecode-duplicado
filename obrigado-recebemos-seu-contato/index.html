  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #2f170f;
      --white: #fff6e3;
      --cream-deep: #efe0c6;
      --green-cta: #315d49;
      --green-on-dark: #a2d4bf;
      --gold-light: #dcbaa2;
      --dark-muted: #f0e1d2;
      --dark-soft: #ddcabb;
      --dark-rule: rgba(255,246,227,0.16);
      --serif: 'Arimo', Helvetica, Arial, sans-serif;
      --sans: 'Montserrat', Helvetica, Arial, sans-serif;
    }
    html { min-height: 100%; }
    body {
      min-height: 100%;
      font-family: var(--sans);
      background: var(--green-cta);
      color: var(--white);
      overflow: hidden;
    }
    .thank-you {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(32px, 6vw, 72px);
      isolation: isolate;
    }
    .thank-you::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(135deg, rgba(47,23,15,0.50) 0%, rgba(47,23,15,0.16) 48%, rgba(47,23,15,0.42) 100%),
        var(--green-cta);
    }
    .thank-you::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: -1;
      width: min(760px, 82vw);
      height: min(760px, 82vw);
      border: 1px solid rgba(255,246,227,0.10);
      transform: translate(-50%, -50%) rotate(8deg);
      pointer-events: none;
    }
    .message {
      width: min(100%, 820px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .logo {
      width: clamp(150px, 16vw, 220px);
      height: auto;
      display: block;
      margin-bottom: clamp(36px, 6vh, 60px);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 10px 18px;
      border: 1px solid var(--dark-rule);
      color: var(--green-on-dark);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .status svg {
      width: 16px;
      height: 16px;
      flex: none;
    }
    h1 {
      font-family: var(--serif);
      font-size: clamp(38px, 5vw, 68px);
      font-weight: 700;
      line-height: 1.06;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }
    h1 em {
      color: var(--gold-light);
      font-style: normal;
    }
    .copy {
      max-width: 680px;
      margin-top: 22px;
      color: var(--dark-muted);
      font-size: clamp(17px, 1.7vw, 22px);
      line-height: 1.55;
      text-wrap: pretty;
    }
    .copy strong {
      color: var(--white);
      font-weight: 600;
    }
    .rule {
      width: min(180px, 40vw);
      height: 1px;
      background: var(--dark-rule);
      margin: clamp(28px, 5vh, 44px) 0 0;
    }
    .note {
      margin-top: 18px;
      color: var(--dark-soft);
      font-size: 13px;
      line-height: 1.5;
    }
    @media (max-width: 640px) {
      body { overflow: auto; }
      .thank-you { padding: 28px 20px; }
      .thank-you::after { width: 84vw; height: 84vw; }
      .logo { width: 310px; max-width: 82vw; margin-bottom: 36px; }
      .status { font-size: 11px; letter-spacing: 0.10em; }
      h1 { font-size: clamp(34px, 11vw, 46px); }
      .copy { font-size: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="thank-you" aria-labelledby="titulo-obrigado">
    <section class="message">
      <img class="logo" src="../images/logo-voll-colorido-negativo.webp" alt="VOLL Pilates Studios" width="220" height="69"/>
      <div class="status">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.2"/>
          <path d="M4.8 8.2l2 2 4.5-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Contato recebido
      </div>
      <h1 id="titulo-obrigado">Tudo certo.<br/><em>Recebemos seus dados.</em></h1>
      <p class="copy">
        Entraremos em contato com você em breve. Falta pouco para o seu sonho se realizar com a <strong>VOLL Pilates Studios</strong>.
      </p>
      <div class="rule" aria-hidden="true"></div>
      <p class="note">Enquanto isso, nossa equipe já está preparando os próximos passos.</p>
    </section>
  </main>
